DOCK_POSITION=left
DOCK_SIZE=38
DOCK_AUTOHIDE=true
DOCK_MAGNIFICATION=true
DOCK_LARGE_SIZE=96
HOT_CORNER_BOTTOM_LEFT=display-sleep
TRACKPAD_SPEED=3
# キーリピートの間隔と、長押しからリピート開始までの待ち時間。小さいほど速い。
# 空にすると既存の設定を維持する。
KEY_REPEAT=2
INITIAL_KEY_REPEAT=15
SCREENSHOT_LOCATION="$HOME/Pictures"
# 対応アプリの文字サイズ（pt）。9〜17、default で標準、空で既存設定を維持する。
TEXT_SIZE=10

# Dock に固定するアプリ。上から順に並べる（Finder は自動で先頭に表示される）。
# 空の配列にすると、既存の固定アプリを変更しない。
DOCK_APPS=(
  "/System/Applications/Apps.app"
  "/System/Applications/System Settings.app"
  "/Applications/Google Chrome.app"
  "/Applications/1Password.app"
  "/Applications/Slack.app"
  "/Applications/iTerm.app"
  "/Applications/Cursor.app"
  "/Applications/ChatGPT.app"
  "/Applications/Claude.app"
  "/System/Applications/QuickTime Player.app"
)
